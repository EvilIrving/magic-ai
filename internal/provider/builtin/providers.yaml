  # ---------------------------------------------------------------------
  # Overseas official — OpenAI-compatible entries (added 2026-09-13 from the
  # OpenRouter model-usage board). Native dialects (Gemini generateContent,
  # Mistral Conversations) are still not projected by Magic.
  # ---------------------------------------------------------------------

  google:
    name: Google Gemini
    key_env: GEMINI_API_KEY
    note: Gemini OpenAI-compatible endpoint; native generateContent dialect is not projected yet.
    endpoints:
      - id: openai-chat
        base_url: https://generativelanguage.googleapis.com/v1beta/openai
        protocol: openai-chat-completions

  mistral:
