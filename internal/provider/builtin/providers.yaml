    key_env: MOONSHOT_API_KEY
    note: "kimi-k2.5 retired 2026-08-31. Current flagship kimi-k3; coding kimi-k2.7-code."
    pick:
      - kimi-k3
      - kimi-k2.7-code
    models:
      haiku: kimi-k2.7-code
      sonnet: kimi-k3
      opus: kimi-k3
