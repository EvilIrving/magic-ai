# Magic built-in provider template
#
# This file ships inside the Magic binary (go:embed) and is the product's
# default catalog. It is NOT the live user config. At runtime Magic merges
# this template under $MAGIC_HOME/providers.yaml with these rules:
#
#   - provider present only in template  -> offered as a default by
#                                            `magic provider add <id>`
#   - provider present in both           -> the user file wins, field by field;
#                                            user `endpoints[]` replace template
#                                            endpoints whole, user `pick` replaces
#                                            template `pick` whole
#   - nothing is ever written into providers.yaml without an explicit command
#
# Secrets are never stored here. `key_env` is a logical index into the secret
# store ($MAGIC_HOME/secrets/), resolved at apply/copy time.
#
# Schema (mirrors internal/catalog):
#   name      display name (shown by `magic providers`; not sent to harnesses)
#   key_env   credential index; convention <VENDOR>_API_KEY
#   pick      suggested default model ids (user config overrides)
#   models    Claude Code role -> model id map (haiku/sonnet/opus/default/…)
#   endpoints list of {id, base_url, protocol}; id is a stable selector used by
#             `magic copy --endpoint <id>` and `magic provider use`
#   note      human note; ignored by tooling
#
# Protocols Magic can project today (canonical values):
#   openai-chat-completions | openai-responses | anthropic-messages
# Providers whose only dialect is Google Generative AI / Mistral Conversations /
# Bedrock are intentionally absent until Magic grows those dialects.
#
# Relays / gateways are user-defined and must not appear in this file.
# Sources for official entries: vendor docs; cross-checked against Pi's shipped
# provider catalog (@earendil-works/pi-ai dist/providers/*.js) and models.dev.
#
# version is informational; bump when the shape or the bulk of the data changes.

version: 2

providers:

  # Relays / gateways are user-defined. Do not ship them here.
  # Put custom endpoints in $MAGIC_HOME/providers.yaml.

  # ---------------------------------------------------------------------------
  # 国内官方
  # ---------------------------------------------------------------------------

  zai:
    name: Z.AI (Coding Plan, global)
    key_env: ZAI_API_KEY
    note: Z.AI coding endpoint. Non-coding base is https://api.z.ai/api/paas/v4.
    pick:
      - glm-5.3
      - glm-5.3-flash
    models:
      haiku: glm-5.3-flash
      sonnet: glm-5.3
      opus: glm-5.3
      default: glm-5.3
      subagent: glm-5.3-flash
    endpoints:
      - id: openai-chat
        base_url: https://api.z.ai/api/coding/paas/v4
        protocol: openai-chat-completions

  zai-coding-cn:
    name: Z.AI (Coding Plan, CN)
    key_env: ZAI_CODING_CN_API_KEY
    pick:
      - glm-5.3
      - glm-5.3-flash
    models:
      haiku: glm-5.3-flash
      sonnet: glm-5.3
      opus: glm-5.3
      default: glm-5.3
      subagent: glm-5.3-flash
