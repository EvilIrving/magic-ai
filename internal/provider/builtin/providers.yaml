    key_env: UPSTAGE_API_KEY
    endpoints:
      - id: openai-chat
        base_url: https://api.upstage.ai/v1/solar
        protocol: openai-chat-completions

  hunyuan:
    name: Tencent Hunyuan
    key_env: HUNYUAN_API_KEY
    note: Tencent Hunyuan OpenAI-compatible endpoint.
    endpoints:
      - id: openai-chat
        base_url: https://hunyuan.cloud.tencent.com/openai/v1
        protocol: openai-chat-completions

# -----------------------------------------------------------------------------
# Not statically addressable (need per-account values) — deliberately omitted:
#   github-copilot     base is per-plan (api.individual.githubcopilot.com) and
#                      auth is an exchanged token, not the provider key
#   cloudflare-ai-gateway  base is
#                      https://gateway.ai.cloudflare.com/v1/<account>/<gateway>
#   opencode (Zen)     base is chosen by the Zen router at request time
#   google / google-vertex  Native Generative AI dialect (generateContent) is
#                      not projected; Gemini is shipped as `google` via the
#                      OpenAI-compatible endpoint
#   mistral            Native Conversations dialect is not projected; shipped
#                      via the OpenAI-compatible endpoint
#   amazon-bedrock     Bedrock Converse dialect — same
# -----------------------------------------------------------------------------
